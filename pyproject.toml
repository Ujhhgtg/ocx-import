[project]
name = "ocx-import"
version = "0.1.0"
description = "Import ChatGPT Web Session and sub2api JSON into OpenCodex"
license = { text = "MIT" }
keywords = ["opencodex", "chatgpt", "sub2api", "oauth", "import"]
readme = "README.md"
authors = [
    { name = "Ujhhgtg", email = "feyxiexzf@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/Ujhhgtg/ocx-import"
Issues = "https://github.com/Ujhhgtg/ocx-import/issues"

[project.scripts]
ocx-import = "ocx_import:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
